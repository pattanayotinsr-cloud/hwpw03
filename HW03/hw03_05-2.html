
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>1.5.2 Form Checkbox</title>

<style>
  fieldset {
    width: 250px;
    padding: 15px;
  }

  legend {
    font-weight: bold;
  }

  input {
    margin: 8px;
  }
</style>
</head>

<body>

<form>

  <fieldset>

    <legend>What is Your Favorite Pet?</legend>

    <!-- Checkbox สามารถเลือกได้หลายตัวเลือก -->
    <input type="checkbox"
    name="favorite_pet"
    value="Cats">Cats<br>

    <input type="checkbox"
    name="favorite_pet"
    value="Dogs">Dogs<br>

    <input type="checkbox"
    name="favorite_pet"
    value="Birds">Birds<br>

    <br>

    <input type="submit" value="Submit now">

  </fieldset>

</form>

</body>
</html>

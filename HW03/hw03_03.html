
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>1.3 Text Decoration</title>

<style>
  .text {
    text-align: center;
    font-size: 70px;
    font-weight: bold;
    color: green;

    /* เพิ่มเส้นใต้ข้อความ */
    text-decoration: underline;

    /* กำหนดสีของเส้นใต้ */
    text-decoration-color: lightgreen;

    /* กำหนดระยะห่างของเส้นใต้ */
    text-underline-offset: 8px;

    /* เพิ่มเงาให้ข้อความ */
    /* ค่า: แนวนอน แนวตั้ง ความเบลอ สี */
    text-shadow: 3px 4px 5px gray;
  }
</style>
</head>

<body>
  <div class="text">
    Computer Science
  </div>
</body>
</html>

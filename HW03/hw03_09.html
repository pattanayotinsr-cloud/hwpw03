
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>1.9 Animate CSS</title>

<!-- เรียกใช้ Animate.css -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

<style>
  body {
    text-align: center;
  }

  h1 {
    margin: 50px;
    color: blue;
  }
</style>
</head>

<body>

<h2>Animate CSS Example</h2>

<!-- Animation แบบที่ 1 -->
<h1 class="animate__animated animate__bounce">
  Computer Science
</h1>

<!-- Animation แบบที่ 2 -->
<h1 class="animate__animated animate__flash">
  Web Programming
</h1>

<!-- Animation แบบที่ 3 -->
<h1 class="animate__animated animate__pulse">
  Computer Technology
</h1>

</body>
</html>
